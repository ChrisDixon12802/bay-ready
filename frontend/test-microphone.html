<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microphone Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
      }
      button {
        padding: 15px 30px;
        font-size: 18px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin: 10px 0;
      }
      button:hover {
        background: #45a049;
      }
      #result {
        margin-top: 20px;
        padding: 15px;
        background: #f0f0f0;
        border-radius: 5px;
        min-height: 50px;
      }
      .error {
        background: #ffebee;
        color: #c62828;
      }
      .success {
        background: #e8f5e9;
        color: #2e7d32;
      }
      .info {
        background: #e3f2fd;
        color: #1565c0;
      }
    </style>
  </head>
  <body>
    <h1>🎤 Microphone Test</h1>

    <div>
      <p><strong>Browser:</strong> <span id="browser"></span></p>
      <p>
        <strong>Speech Recognition:</strong> <span id="speechSupport"></span>
      </p>
    </div>

    <button onclick="testMicrophone()">🎤 Test Microphone</button>

    <div id="result" class="info">
      Click the button above to test your microphone. You should see a
      permission prompt.
    </div>

    <script>
      // Check browser
      const browserInfo = navigator.userAgent;
      document.getElementById("browser").textContent = browserInfo.includes(
        "Chrome",
      )
        ? "Chrome ✅"
        : browserInfo.includes("Edge")
          ? "Edge ✅"
          : browserInfo.includes("Firefox")
            ? "Firefox ❌ (Not Supported)"
            : browserInfo.includes("Safari")
              ? "Safari ❌ (Limited Support)"
              : "Unknown";

      // Check Speech Recognition support
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;
      document.getElementById("speechSupport").textContent = SpeechRecognition
        ? "Supported ✅"
        : "Not Supported ❌";

      function testMicrophone() {
        const resultDiv = document.getElementById("result");

        if (!SpeechRecognition) {
          resultDiv.className = "error";
          resultDiv.innerHTML =
            "<strong>❌ Error:</strong> Speech Recognition is not supported in this browser.<br>Please use Chrome or Edge.";
          return;
        }

        resultDiv.className = "info";
        resultDiv.innerHTML = "🎤 Requesting microphone permission...";

        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = "en-US";

        let speechDetected = false;

        recognition.onstart = () => {
          resultDiv.className = "success";
          resultDiv.innerHTML =
            "🎤 <strong>Microphone is working!</strong><br>Say something...";
          speechDetected = false;
        };

        recognition.onresult = (event) => {
          speechDetected = true;
          let transcript = "";
          for (let i = 0; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
          }
          resultDiv.className = "success";
          resultDiv.innerHTML = `✅ <strong>You said:</strong> "${transcript}"<br><em>Microphone is working correctly!</em>`;
        };

        recognition.onerror = (event) => {
          resultDiv.className = "error";
          let errorMsg = "";
          switch (event.error) {
            case "not-allowed":
            case "permission-denied":
              errorMsg =
                '<strong>❌ Permission Denied!</strong><br>You need to allow microphone access.<br>Look for the microphone icon in your browser\'s address bar and click "Allow".';
              break;
            case "no-speech":
              errorMsg =
                "<strong>⚠️ No speech detected</strong><br>Try speaking louder or check your microphone in Windows Sound settings.";
              break;
            case "audio-capture":
              errorMsg =
                "<strong>❌ Microphone not found</strong><br>Make sure your microphone is plugged in and working.";
              break;
            case "network":
              errorMsg =
                "<strong>❌ Network error</strong><br>Speech recognition requires an internet connection.";
              break;
            default:
              errorMsg = `<strong>❌ Error:</strong> ${event.error}<br>${event.message || "Unknown error"}`;
          }
          resultDiv.innerHTML = errorMsg;
        };

        recognition.onend = () => {
          if (!speechDetected) {
            resultDiv.className = "info";
            resultDiv.innerHTML =
              "⚠️ Microphone stopped but no speech was detected.<br>Try again and speak clearly.";
          }
        };

        try {
          recognition.start();
        } catch (error) {
          resultDiv.className = "error";
          resultDiv.innerHTML = `<strong>❌ Error starting recognition:</strong><br>${error.message}`;
        }
      }
    </script>
  </body>
</html>
