<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Voice-first task management for service shops. Track checklists, tasks, and orders with AI-powered voice commands."
    />
    <meta name="theme-color" content="#6366f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Bay Ready" />
    <link rel="apple-touch-icon" href="/icons/icon-180x180.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Bay Ready - Shop Floor Task Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Service Worker for PWA installation on iPad and mobile devices
      console.log("[PWA Debug] Starting service worker registration check...");

      if ("serviceWorker" in navigator) {
        console.log("[PWA Debug] Service Worker API available");

        window.addEventListener("load", () => {
          console.log("[PWA Debug] Window load event fired");

          // Check manifest
          fetch("/manifest.json")
            .then((r) => {
              console.log("[PWA Debug] Manifest fetch status:", r.status);
              return r.json();
            })
            .then((manifest) => {
              console.log("[PWA Debug] Manifest valid:", manifest);
            })
            .catch((err) =>
              console.log("[PWA Debug] Manifest fetch failed:", err),
            );

          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log(
                "[PWA Debug] ✅ Service Worker registered SUCCESSFULLY:",
                registration,
              );
              console.log("[PWA Debug] Scope:", registration.scope);
            })
            .catch((error) => {
              console.error(
                "[PWA Debug] ❌ Service Worker registration FAILED:",
                error.message,
                error,
              );
            });
        });
      } else {
        console.log("[PWA Debug] Service Worker API NOT available");
      }

      // Prompt to install app (PWA)
      let deferredPrompt;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        // Show install button/prompt to user
        console.log("PWA installable");
      });

      window.addEventListener("appinstalled", () => {
        console.log("PWA was installed");
        deferredPrompt = null;
      });
    </script>
  </body>
</html>
