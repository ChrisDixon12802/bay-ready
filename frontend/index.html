<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Voice-first task management for service shops. Track checklists, tasks, and orders with AI-powered voice commands."
    />
    <meta name="theme-color" content="#6366f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Bay Ready" />
    <link rel="apple-touch-icon" href="/icons/icon-180x180.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Bay Ready - Shop Floor Task Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Service Worker for PWA installation on iPad and mobile devices
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log("Service Worker registered:", registration);
            })
            .catch((error) => {
              console.log("Service Worker registration failed:", error);
            });
        });
      }

      // Prompt to install app (PWA)
      let deferredPrompt;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        // Show install button/prompt to user
        console.log("PWA installable");
      });

      window.addEventListener("appinstalled", () => {
        console.log("PWA was installed");
        deferredPrompt = null;
      });
    </script>
  </body>
</html>
